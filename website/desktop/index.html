<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Duckie — Windows 桌面端</title>
  <meta name="description" content="下载 Duckie，在 Windows 11 切换经典与系统默认右键菜单。">
  <link rel="canonical" href="https://duckie.cg-zhou.top/desktop/">
  <link rel="icon" type="image/svg+xml" href="/assets/duck.svg">
  <meta property="og:title" content="Duckie — Windows 桌面端">
  <meta property="og:description" content="在 Windows 11 切换经典与系统默认右键菜单。">
  <meta property="og:url" content="https://duckie.cg-zhou.top/desktop/">
  <meta property="og:type" content="website">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Duckie 首页"><img src="/assets/duck.svg" width="32" height="32" alt=""><span>Duckie<span class="brand-dot">.</span></span></a>
      <nav aria-label="主导航">
        <a href="/">在线工具</a>
        <a href="https://github.com/cg-zhou/duckie">GitHub</a>
      </nav>
    </header>
    <main class="desktop-layout">
      <section class="desktop-download" aria-labelledby="desktop-title">
        <h1 id="desktop-title">Windows 右键菜单</h1>
        <p class="desktop-intro">在经典菜单和系统默认菜单之间切换。</p>
        <div class="download-actions">
          <wb-button id="download" variant="primary" href="https://github.com/cg-zhou/duckie/releases">前往 GitHub Releases</wb-button>
          <a id="release-history" href="https://github.com/cg-zhou/duckie/releases" hidden>版本记录</a>
        </div>
        <p class="desktop-meta" id="release-note" hidden></p>
        <p class="desktop-meta">Windows 11 · .NET Framework 4.8</p>
        <details class="integrity" id="integrity" hidden>
          <summary>SHA-256 校验</summary>
          <p class="desktop-meta">当前便携版未签名，可用下方校验值核对 ZIP 文件。</p>
          <code id="checksum"></code>
          <div class="download-actions">
            <wb-button id="copy-checksum" size="sm">复制校验值</wb-button>
            <a id="checksum-link" href="https://github.com/cg-zhou/duckie/releases">校验文件</a>
          </div>
          <span id="copy-status" role="status" class="sr-only"></span>
        </details>
      </section>
      <section aria-label="菜单预览">
        <div class="menu-pair">
          <figure>
            <figcaption>经典菜单</figcaption>
            <img src="/assets/classic.png" width="258" height="354" alt="经典右键菜单，直接显示常用操作">
          </figure>
          <figure>
            <figcaption>Windows 11 默认菜单</figcaption>
            <img src="/assets/windows-11.png" width="258" height="354" alt="Windows 11 右键菜单，底部提供显示更多选项">
          </figure>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
